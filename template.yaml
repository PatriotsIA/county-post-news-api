AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: County Post News API on a low-cost Lambda Function URL.

Parameters:
  MetalsApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Metals.dev API key for the precious-metals ticker.
  UsdaMarsApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: USDA MARS API key for the cattle and agriculture ticker.
  FredApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: FRED API key for county economic data.
  StripeSecretKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Stripe secret key used only to create hosted Checkout sessions.
  StripeCheckoutSuccessUrl:
    Type: String
    Default: "https://thecountypost.com/payments?checkout=success"
    Description: Frontend URL Stripe redirects to after a successful payment.
  StripeCheckoutCancelUrl:
    Type: String
    Default: "https://thecountypost.com/payments?checkout=cancelled"
    Description: Frontend URL Stripe redirects to when Checkout is cancelled.

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - arm64
    Timeout: 90
    MemorySize: 1536
    Environment:
      Variables:
        CACHE_TTL_SECONDS: "300"
        REQUEST_TIMEOUT_MS: "3500"
        DEFAULT_LIMIT: "48"
        MAX_LIMIT: "200"
        COUNTY_FALLBACK_MIN_ITEMS: "12"
        ARTICLE_MAX_AGE_DAYS: "183"
        FRESHNESS_FOCUS_DAYS: "14"
        STATE_MARKET_LIMIT: "4"
        COUNTY_MARKET_LIMIT: "3"
        COUNTY_NEARBY_LIMIT: "3"
        COUNTY_MARKET_TIER_ENABLED: "true"
        COUNTY_AGENCY_QUERY_ENABLED: "true"
        COUNTY_PRIMARY_QUERY_LIMIT: "4"
        COUNTY_MARKET_QUERY_LIMIT: "4"
        GDELT_ENABLED: "true"
        GDELT_MAX_RECORDS: "100"
        BING_NEWS_ENABLED: "true"
        PAGE_SECTION_CONCURRENCY: "4"
        UPSTREAM_CONCURRENCY: "12"
        ARTICLE_IMAGE_LOOKUP_LIMIT: "4"
        MAX_RSS_URLS_PER_FEED: "18"
        MAX_ARTICLE_QUERIES_PER_FEED: "6"
        CORS_ORIGINS: "https://main.d2z6lt4e5q50in.amplifyapp.com,https://advertiser-preview.d2z6lt4e5q50in.amplifyapp.com,https://thecountypost.com,https://www.thecountypost.com"
        METALS_API_KEY: !Ref MetalsApiKey
        METALS_CACHE_TTL_SECONDS: "60"
        USDA_MARS_API_KEY: !Ref UsdaMarsApiKey
        MARS_API_KEY: !Ref UsdaMarsApiKey
        FRED_API_KEY: !Ref FredApiKey
        FRED_CACHE_TTL_SECONDS: "21600"
        STRIPE_SK_KEY: !Ref StripeSecretKey
        STRIPE_CHECKOUT_SUCCESS_URL: !Ref StripeCheckoutSuccessUrl
        STRIPE_CHECKOUT_CANCEL_URL: !Ref StripeCheckoutCancelUrl
        ADVERTISING_CREATIVE_BUCKET: !Ref AdvertisingCreativeBucket
        ADVERTISING_CREATIVE_MAX_BYTES: "10485760"

Resources:
  NewsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/src/handler.handler
      Policies:
        - S3WritePolicy:
            BucketName: !Ref AdvertisingCreativeBucket
      FunctionUrlConfig:
        AuthType: NONE

  AdvertisingCreativeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - POST
            AllowedOrigins:
              - http://localhost:5173
              - https://main.d2z6lt4e5q50in.amplifyapp.com
              - https://advertiser-preview.d2z6lt4e5q50in.amplifyapp.com
              - https://thecountypost.com
              - https://www.thecountypost.com
            MaxAge: 300

Outputs:
  NewsApiUrl:
    Description: Public Lambda Function URL for the news API.
    Value: !GetAtt NewsApiFunctionUrl.FunctionUrl
