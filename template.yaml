AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: County Post News API on a low-cost Lambda Function URL.

Parameters:
  EnableEdgeCache:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Enable the API edge cache after AWS account verification. The shared
      cache and queued refreshes also work with this disabled.
  CorsOrigins:
    Type: String
    Default: "https://main.d2z6lt4e5q50in.amplifyapp.com,https://advertiser-preview.d2z6lt4e5q50in.amplifyapp.com,https://thecountypost.com,https://www.thecountypost.com,https://advertise.thecountypost.com,https://www.advertise.thecountypost.com,https://patriotsinaction.com,https://www.patriotsinaction.com"
    Description: Comma-separated browser origins allowed to call the API, without trailing slashes.
  UsdaMarsApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: USDA MARS API key for the cattle and agriculture ticker.
  FredApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: FRED API key for county economic data.
  CensusApiKey:
    Type: String
    NoEcho: true
    Description: Free Census API key required by scheduled atlas ingestion.
  AtlasCensusYear:
    Type: String
    Default: "2024"
    AllowedPattern: "^20[0-9]{2}$"
    Description: ACS 5-year release year to ingest.
  AtlasSourceLocation:
    Type: String
    Default: "https://github.com/ErikBurdett/county-post-news-api.git"
    Description: Git repository cloned by the independent atlas CodeBuild project.
  AtlasSourceVersion:
    Type: String
    Default: "main"
    Description: Git branch, tag, or commit used for atlas ingestion.
  AtlasIngestionSchedule:
    Type: String
    Default: "rate(5 days)"
    Description: EventBridge schedule for validated atlas snapshot refreshes.
  StripeSecretKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Stripe secret key used only to create hosted Checkout sessions.
  StripeCheckoutSuccessUrl:
    Type: String
    Default: "https://www.advertise.thecountypost.com/?checkout=success"
    Description: Frontend URL Stripe redirects to after a successful payment.
  StripeCheckoutCancelUrl:
    Type: String
    Default: "https://www.advertise.thecountypost.com/?checkout=cancelled"
    Description: Frontend URL Stripe redirects to when Checkout is cancelled.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Timeout: 120
    MemorySize: 1536
    Environment:
      Variables:
        CACHE_TTL_SECONDS: "300"
        REQUEST_TIMEOUT_MS: "3500"
        DEFAULT_LIMIT: "120"
        MAX_LIMIT: "600"
        COUNTY_FALLBACK_MIN_ITEMS: "12"
        ARTICLE_MAX_AGE_DAYS: "183"
        FRESHNESS_FOCUS_DAYS: "14"
        STATE_MARKET_LIMIT: "4"
        COUNTY_MARKET_LIMIT: "3"
        COUNTY_NEARBY_LIMIT: "3"
        COUNTY_MARKET_TIER_ENABLED: "true"
        COUNTY_AGENCY_QUERY_ENABLED: "true"
        COUNTY_LOCAL_SOURCE_SEARCH_ENABLED: "true"
        COUNTY_PUBLISHER_BALANCE_ENABLED: "true"
        COUNTY_SINGLE_PUBLISHER_MAX: "90"
        COUNTY_OTHER_SOURCES_TARGET: "90"
        COUNTY_PRIMARY_QUERY_LIMIT: "8"
        COUNTY_MARKET_QUERY_LIMIT: "6"
        GDELT_ENABLED: "true"
        GDELT_MAX_RECORDS: "100"
        BING_NEWS_ENABLED: "true"
        PAGE_SECTION_CONCURRENCY: "4"
        UPSTREAM_CONCURRENCY: "20"
        ARTICLE_IMAGE_LOOKUP_LIMIT: "24"
        IMAGE_ENRICHMENT_BUDGET_MS: "750"
        MAX_RSS_URLS_PER_FEED: "30"
        MAX_ARTICLE_QUERIES_PER_FEED: "10"
        # Both providers are used. Bing surfaces results Google misses and names
        # the publisher Google omits, but returns far fewer items per slot, so it
        # takes a minority of the URL budget rather than 40 percent of it.
        BING_NEWS_URL_SHARE: "0.2"
        # When one publisher supplies more than this, the desk reaches out for
        # others. Deliberately far below COUNTY_SINGLE_PUBLISHER_MAX, which caps
        # how many stories one outlet may contribute rather than deciding when a
        # feed looks too monotonous.
        COUNTY_PUBLISHER_DIVERSITY_THRESHOLD: "12"
        # Recency bands: newest first inside each, freshest band first.
        RECENCY_PRIMARY_DAYS: "60"
        RECENCY_SECONDARY_DAYS: "180"
        COUNTY_PLACE_QUERY_LIMIT: "4"
        CORS_ORIGINS: !Ref CorsOrigins
        METALS_PROVIDER_URL: "https://mintedmetal.com/api/prices.json"
        METALS_CACHE_TTL_SECONDS: "900"
        FRED_CACHE_TTL_SECONDS: "21600"
        NWS_API_BASE: "https://api.weather.gov"
        NWS_USER_AGENT: "TheCountyPost/1.0 (https://thecountypost.com; contact@thecountypost.com)"
        WEATHER_POINTS_CACHE_TTL_SECONDS: "86400"
        WEATHER_RESPONSE_CACHE_TTL_SECONDS: "600"
        WEATHER_ALERTS_CACHE_TTL_SECONDS: "180"
        USDM_API_BASE: "https://usdmdataservices.unl.edu"
        DROUGHT_CACHE_TTL_SECONDS: "21600"
        NASA_POWER_API_BASE: "https://power.larc.nasa.gov"
        RAINFALL_HISTORY_DAYS: "14"
        RAINFALL_CACHE_TTL_SECONDS: "86400"
        WEATHER_TIMEOUT_MS: "5000"
        ATLAS_DATA_BUCKET: !Ref AtlasDataBucket
        ATLAS_DATA_PREFIX: ""
        ATLAS_CACHE_TTL_SECONDS: "3600"
        ATLAS_MANIFEST_CACHE_TTL_SECONDS: "300"
        ATLAS_PUBLIC_CACHE_TTL_SECONDS: "86400"
        STRIPE_CHECKOUT_SUCCESS_URL: !Ref StripeCheckoutSuccessUrl
        STRIPE_CHECKOUT_CANCEL_URL: !Ref StripeCheckoutCancelUrl
        ADVERTISING_CREATIVE_BUCKET: !Ref AdvertisingCreativeBucket
        ADVERTISING_CREATIVE_MAX_BYTES: "10485760"

Conditions:
  EdgeCacheEnabled: !Equals [!Ref EnableEdgeCache, "true"]

Resources:
  NewsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/src/handler.handler
      Policies:
        - S3WritePolicy:
            BucketName: !Ref AdvertisingCreativeBucket
        - S3ReadPolicy:
            BucketName: !Ref AtlasDataBucket
        - S3CrudPolicy:
            BucketName: !Ref FeedCacheBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt FeedRefreshQueue.QueueName
      Environment:
        Variables:
          FEED_CACHE_BUCKET: !Ref FeedCacheBucket
          FEED_REFRESH_QUEUE_URL: !Ref FeedRefreshQueue
          USDA_MARS_API_KEY: !Ref UsdaMarsApiKey
          MARS_API_KEY: !Ref UsdaMarsApiKey
          FRED_API_KEY: !Ref FredApiKey
          STRIPE_SK_KEY: !Ref StripeSecretKey
      FunctionUrlConfig:
        AuthType: NONE

  # ---------------------------------------------------------------------------
  # Edge cache in front of the news API.
  #
  # The function's own cache is per-instance memory with a five-minute TTL;
  # across 3,143 counties nearly every reader was a cold hit paying the full
  # upstream fan-out (measured at 9-27 seconds). CloudFront makes the s-maxage
  # the API already sends real, and stale-while-revalidate means an expired
  # entry is served instantly while the edge refreshes it in the background.
  # Origin Shield funnels every edge location through one regional cache, so the
  # worker can prime a shared regional entry behind the edge locations.
  # ---------------------------------------------------------------------------
  NewsApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Condition: EdgeCacheEnabled
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-news-api-cache"
        Comment: Query strings select the feed; Origin is in the key because CORS responses echo it.
        DefaultTTL: 300
        MinTTL: 0
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - Origin
          QueryStringsConfig:
            QueryStringBehavior: whitelist
            QueryStrings: [limit, offset, sections]

  NewsApiDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: EdgeCacheEnabled
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: County Post News API edge cache
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: news-api-function
            DomainName: !Select [2, !Split ["/", !GetAtt NewsApiFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
              OriginReadTimeout: 60
            OriginShield:
              Enabled: true
              OriginShieldRegion: !Ref AWS::Region
        CustomErrorResponses:
          - ErrorCode: 500
            ErrorCachingMinTTL: 0
          - ErrorCode: 502
            ErrorCachingMinTTL: 0
          - ErrorCode: 503
            ErrorCachingMinTTL: 0
          - ErrorCode: 504
            ErrorCachingMinTTL: 0
        DefaultCacheBehavior:
          TargetOriginId: news-api-function
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref NewsApiCachePolicy
          # Managed AllViewerExceptHostHeader: forward everything except Host,
          # which must stay the function URL's own for Lambda to accept it.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  # Shared response cache. The in-memory cache only helps the instance that
  # filled it; this bucket is what every instance reads, so a reader is served
  # a stored county desk instantly — fresh or stale — and the warmer below is
  # what rebuilds. Objects self-expire; nothing here is a source of truth.
  FeedCacheBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-cache-entries
            Status: Enabled
            ExpirationInDays: 3

  FeedRefreshDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-feed-refresh-dlq.fifo"
      FifoQueue: true
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  FeedRefreshQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-feed-refresh.fifo"
      FifoQueue: true
      SqsManagedSseEnabled: true
      VisibilityTimeout: 1080
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FeedRefreshDeadLetterQueue.Arn
        maxReceiveCount: 5

  FeedRefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/src/refresh-worker.handler
      Timeout: 180
      MemorySize: 1536
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref FeedCacheBucket
      Environment:
        Variables:
          FEED_CACHE_BUCKET: !Ref FeedCacheBucket
          FEED_EDGE_URL: !If [EdgeCacheEnabled, !Sub "https://${NewsApiDistribution.DomainName}", ""]
          REQUEST_TIMEOUT_MS: "8000"
          FEED_EDGE_ORIGINS: "https://thecountypost.com,https://patriotsinaction.com"
      Events:
        RefreshQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt FeedRefreshQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 3

  FeedRefreshLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FeedRefreshFunction}"
      RetentionInDays: 30

  FeedWarmerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/src/warmer.handler
      Timeout: 60
      MemorySize: 512
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt FeedRefreshQueue.QueueName
      Environment:
        Variables:
          FEED_REFRESH_QUEUE_URL: !Ref FeedRefreshQueue
          WARM_STATES: "all"
      Events:
        WarmSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Description: Queue bounded national, state, and county feed refreshes.

  FeedRefreshBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Feed refreshes have waited over 15 minutes; inspect worker capacity and source failures.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FeedRefreshQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  FeedRefreshDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Feed refreshes exhausted retries; inspect the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FeedRefreshDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  FeedWarmerFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scheduled feed refresh jobs could not be queued.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref FeedWarmerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AdvertisingCreativeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - POST
            AllowedOrigins:
              - http://localhost:5173
              - https://main.d2z6lt4e5q50in.amplifyapp.com
              - https://advertiser-preview.d2z6lt4e5q50in.amplifyapp.com
              - https://thecountypost.com
              - https://www.thecountypost.com
              - https://advertise.thecountypost.com
              - https://www.advertise.thecountypost.com
            MaxAge: 300

  AtlasDataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentManifestVersions
            Prefix: ""
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  AtlasDataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AtlasDataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt AtlasDataBucket.Arn
              - !Sub "${AtlasDataBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  AtlasIngestionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${AWS::StackName}-atlas-ingestion"
      RetentionInDays: 30

  AtlasIngestionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codebuild.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: AtlasIngestion
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PublishAtlasSnapshot
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !GetAtt AtlasDataBucket.Arn
              - Sid: WriteAtlasObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${AtlasDataBucket.Arn}/*"
              - Sid: WriteBuildLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-atlas-ingestion:*"
              - Sid: PublishAtlasHealthMetric
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: CountyPost/Atlas

  AtlasIngestionProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-atlas-ingestion"
      Description: Independently downloads, validates, and publishes County Data Atlas snapshots.
      ServiceRole: !GetAtt AtlasIngestionRole.Arn
      TimeoutInMinutes: 60
      QueuedTimeoutInMinutes: 30
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: ATLAS_DATA_BUCKET
            Type: PLAINTEXT
            Value: !Ref AtlasDataBucket
          - Name: ATLAS_CENSUS_YEAR
            Type: PLAINTEXT
            Value: !Ref AtlasCensusYear
          - Name: ATLAS_EXPECTED_MIN_COUNTIES
            Type: PLAINTEXT
            Value: "3100"
          - Name: ATLAS_EXPECTED_MAX_COUNTIES
            Type: PLAINTEXT
            Value: "3250"
          - Name: ATLAS_PUBLIC_CACHE_TTL_SECONDS
            Type: PLAINTEXT
            Value: "86400"
          - Name: CENSUS_API_KEY
            Type: PLAINTEXT
            Value: !Ref CensusApiKey
      Source:
        Type: GITHUB
        Location: !Ref AtlasSourceLocation
        GitCloneDepth: 1
        BuildSpec: buildspec.atlas.yml
      SourceVersion: !Ref AtlasSourceVersion
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref AtlasIngestionLogGroup
          StreamName: ingestion

  AtlasScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: StartAtlasIngestion
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                Resource: !GetAtt AtlasIngestionProject.Arn

  AtlasIngestionScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Refresh validated County Data Atlas snapshots independently of API deployments.
      ScheduleExpression: !Ref AtlasIngestionSchedule
      State: ENABLED
      Targets:
        - Arn: !GetAtt AtlasIngestionProject.Arn
          Id: AtlasIngestionProject
          RoleArn: !GetAtt AtlasScheduleRole.Arn

  AtlasBuildFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Atlas ingestion reported a failed CodeBuild run.
      Namespace: AWS/CodeBuild
      MetricName: FailedBuilds
      Dimensions:
        - Name: ProjectName
          Value: !Ref AtlasIngestionProject
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  AtlasStaleDataAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: No successful validated atlas publication has been observed for six days.
      Namespace: CountyPost/Atlas
      MetricName: SuccessfulPublish
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 6
      DatapointsToAlarm: 6
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  AtlasScheduleFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: EventBridge could not start the atlas ingestion project.
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions:
        - Name: RuleName
          Value: !Ref AtlasIngestionScheduleRule
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  NewsApiUrl:
    Description: Public Lambda Function URL for the news API.
    Value: !GetAtt NewsApiFunctionUrl.FunctionUrl
  NewsApiEdgeUrl:
    Condition: EdgeCacheEnabled
    Description: CloudFront domain the site should call; edge-cached with stale-while-revalidate.
    Value: !Sub "https://${NewsApiDistribution.DomainName}"
  FeedRefreshQueueUrl:
    Description: FIFO queue for scheduled and reader-triggered feed refreshes.
    Value: !Ref FeedRefreshQueue
  AtlasDataBucketName:
    Description: Private versioned bucket containing active County Data Atlas snapshots.
    Value: !Ref AtlasDataBucket
  AtlasIngestionProjectName:
    Description: Scheduled CodeBuild project for atlas ingestion.
    Value: !Ref AtlasIngestionProject
  AtlasIngestionScheduleName:
    Description: EventBridge rule that starts atlas ingestion.
    Value: !Ref AtlasIngestionScheduleRule
