AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: County Post News API on a low-cost Lambda Function URL.

Parameters:
  UsdaMarsApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: USDA MARS API key for the cattle and agriculture ticker.
  FredApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: FRED API key for county economic data.
  CensusApiKey:
    Type: String
    NoEcho: true
    Description: Free Census API key required by scheduled atlas ingestion.
  AtlasCensusYear:
    Type: String
    Default: "2024"
    AllowedPattern: "^20[0-9]{2}$"
    Description: ACS 5-year release year to ingest.
  AtlasSourceLocation:
    Type: String
    Default: "https://github.com/ErikBurdett/county-post-news-api.git"
    Description: Git repository cloned by the independent atlas CodeBuild project.
  AtlasSourceVersion:
    Type: String
    Default: "main"
    Description: Git branch, tag, or commit used for atlas ingestion.
  AtlasIngestionSchedule:
    Type: String
    Default: "rate(5 days)"
    Description: EventBridge schedule for validated atlas snapshot refreshes.
  StripeSecretKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Stripe secret key used only to create hosted Checkout sessions.
  StripeCheckoutSuccessUrl:
    Type: String
    Default: "https://thecountypost.com/payments?checkout=success"
    Description: Frontend URL Stripe redirects to after a successful payment.
  StripeCheckoutCancelUrl:
    Type: String
    Default: "https://thecountypost.com/payments?checkout=cancelled"
    Description: Frontend URL Stripe redirects to when Checkout is cancelled.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Timeout: 90
    MemorySize: 1536
    Environment:
      Variables:
        CACHE_TTL_SECONDS: "300"
        REQUEST_TIMEOUT_MS: "3500"
        DEFAULT_LIMIT: "48"
        MAX_LIMIT: "200"
        COUNTY_FALLBACK_MIN_ITEMS: "12"
        ARTICLE_MAX_AGE_DAYS: "183"
        FRESHNESS_FOCUS_DAYS: "14"
        STATE_MARKET_LIMIT: "4"
        COUNTY_MARKET_LIMIT: "3"
        COUNTY_NEARBY_LIMIT: "3"
        COUNTY_MARKET_TIER_ENABLED: "true"
        COUNTY_AGENCY_QUERY_ENABLED: "true"
        COUNTY_LOCAL_SOURCE_SEARCH_ENABLED: "true"
        COUNTY_PUBLISHER_BALANCE_ENABLED: "true"
        COUNTY_SINGLE_PUBLISHER_MAX: "25"
        COUNTY_OTHER_SOURCES_TARGET: "25"
        COUNTY_PRIMARY_QUERY_LIMIT: "4"
        COUNTY_MARKET_QUERY_LIMIT: "4"
        GDELT_ENABLED: "true"
        GDELT_MAX_RECORDS: "100"
        BING_NEWS_ENABLED: "true"
        PAGE_SECTION_CONCURRENCY: "4"
        UPSTREAM_CONCURRENCY: "12"
        ARTICLE_IMAGE_LOOKUP_LIMIT: "4"
        MAX_RSS_URLS_PER_FEED: "18"
        MAX_ARTICLE_QUERIES_PER_FEED: "6"
        CORS_ORIGINS: "https://main.d2z6lt4e5q50in.amplifyapp.com,https://advertiser-preview.d2z6lt4e5q50in.amplifyapp.com,https://thecountypost.com,https://www.thecountypost.com,https://advertise.thecountypost.com,https://www.advertise.thecountypost.com"
        METALS_PROVIDER_URL: "https://mintedmetal.com/api/prices.json"
        METALS_CACHE_TTL_SECONDS: "900"
        USDA_MARS_API_KEY: !Ref UsdaMarsApiKey
        MARS_API_KEY: !Ref UsdaMarsApiKey
        FRED_API_KEY: !Ref FredApiKey
        FRED_CACHE_TTL_SECONDS: "21600"
        NWS_API_BASE: "https://api.weather.gov"
        NWS_USER_AGENT: "TheCountyPost/1.0 (https://thecountypost.com; contact@thecountypost.com)"
        WEATHER_POINTS_CACHE_TTL_SECONDS: "86400"
        WEATHER_RESPONSE_CACHE_TTL_SECONDS: "600"
        WEATHER_ALERTS_CACHE_TTL_SECONDS: "180"
        USDM_API_BASE: "https://usdmdataservices.unl.edu"
        DROUGHT_CACHE_TTL_SECONDS: "21600"
        NASA_POWER_API_BASE: "https://power.larc.nasa.gov"
        RAINFALL_HISTORY_DAYS: "14"
        RAINFALL_CACHE_TTL_SECONDS: "86400"
        WEATHER_TIMEOUT_MS: "5000"
        ATLAS_DATA_BUCKET: !Ref AtlasDataBucket
        ATLAS_DATA_PREFIX: ""
        ATLAS_CACHE_TTL_SECONDS: "3600"
        ATLAS_MANIFEST_CACHE_TTL_SECONDS: "300"
        ATLAS_PUBLIC_CACHE_TTL_SECONDS: "86400"
        STRIPE_SK_KEY: !Ref StripeSecretKey
        STRIPE_CHECKOUT_SUCCESS_URL: !Ref StripeCheckoutSuccessUrl
        STRIPE_CHECKOUT_CANCEL_URL: !Ref StripeCheckoutCancelUrl
        ADVERTISING_CREATIVE_BUCKET: !Ref AdvertisingCreativeBucket
        ADVERTISING_CREATIVE_MAX_BYTES: "10485760"

Resources:
  NewsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/src/handler.handler
      Policies:
        - S3WritePolicy:
            BucketName: !Ref AdvertisingCreativeBucket
        - S3ReadPolicy:
            BucketName: !Ref AtlasDataBucket
      FunctionUrlConfig:
        AuthType: NONE

  AdvertisingCreativeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - POST
            AllowedOrigins:
              - http://localhost:5173
              - https://main.d2z6lt4e5q50in.amplifyapp.com
              - https://advertiser-preview.d2z6lt4e5q50in.amplifyapp.com
              - https://thecountypost.com
              - https://www.thecountypost.com
              - https://advertise.thecountypost.com
              - https://www.advertise.thecountypost.com
            MaxAge: 300

  AtlasDataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentManifestVersions
            Prefix: ""
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  AtlasDataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AtlasDataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt AtlasDataBucket.Arn
              - !Sub "${AtlasDataBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  AtlasIngestionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${AWS::StackName}-atlas-ingestion"
      RetentionInDays: 30

  AtlasIngestionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codebuild.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: AtlasIngestion
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PublishAtlasSnapshot
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !GetAtt AtlasDataBucket.Arn
              - Sid: WriteAtlasObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${AtlasDataBucket.Arn}/*"
              - Sid: WriteBuildLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-atlas-ingestion:*"
              - Sid: PublishAtlasHealthMetric
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: CountyPost/Atlas

  AtlasIngestionProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-atlas-ingestion"
      Description: Independently downloads, validates, and publishes County Data Atlas snapshots.
      ServiceRole: !GetAtt AtlasIngestionRole.Arn
      TimeoutInMinutes: 60
      QueuedTimeoutInMinutes: 30
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: ATLAS_DATA_BUCKET
            Type: PLAINTEXT
            Value: !Ref AtlasDataBucket
          - Name: ATLAS_CENSUS_YEAR
            Type: PLAINTEXT
            Value: !Ref AtlasCensusYear
          - Name: ATLAS_EXPECTED_MIN_COUNTIES
            Type: PLAINTEXT
            Value: "3100"
          - Name: ATLAS_EXPECTED_MAX_COUNTIES
            Type: PLAINTEXT
            Value: "3250"
          - Name: ATLAS_PUBLIC_CACHE_TTL_SECONDS
            Type: PLAINTEXT
            Value: "86400"
          - Name: CENSUS_API_KEY
            Type: PLAINTEXT
            Value: !Ref CensusApiKey
      Source:
        Type: GITHUB
        Location: !Ref AtlasSourceLocation
        GitCloneDepth: 1
        BuildSpec: buildspec.atlas.yml
      SourceVersion: !Ref AtlasSourceVersion
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref AtlasIngestionLogGroup
          StreamName: ingestion

  AtlasScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: StartAtlasIngestion
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                Resource: !GetAtt AtlasIngestionProject.Arn

  AtlasIngestionScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Refresh validated County Data Atlas snapshots independently of API deployments.
      ScheduleExpression: !Ref AtlasIngestionSchedule
      State: ENABLED
      Targets:
        - Arn: !GetAtt AtlasIngestionProject.Arn
          Id: AtlasIngestionProject
          RoleArn: !GetAtt AtlasScheduleRole.Arn

  AtlasBuildFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Atlas ingestion reported a failed CodeBuild run.
      Namespace: AWS/CodeBuild
      MetricName: FailedBuilds
      Dimensions:
        - Name: ProjectName
          Value: !Ref AtlasIngestionProject
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  AtlasStaleDataAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: No successful validated atlas publication has been observed for six days.
      Namespace: CountyPost/Atlas
      MetricName: SuccessfulPublish
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 6
      DatapointsToAlarm: 6
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  AtlasScheduleFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: EventBridge could not start the atlas ingestion project.
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions:
        - Name: RuleName
          Value: !Ref AtlasIngestionScheduleRule
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  NewsApiUrl:
    Description: Public Lambda Function URL for the news API.
    Value: !GetAtt NewsApiFunctionUrl.FunctionUrl
  AtlasDataBucketName:
    Description: Private versioned bucket containing active County Data Atlas snapshots.
    Value: !Ref AtlasDataBucket
  AtlasIngestionProjectName:
    Description: Scheduled CodeBuild project for atlas ingestion.
    Value: !Ref AtlasIngestionProject
  AtlasIngestionScheduleName:
    Description: EventBridge rule that starts atlas ingestion.
    Value: !Ref AtlasIngestionScheduleRule
